name: Storefront checks

on:
  push:
    branches:
      - storefront-gallery-newyear-20261031
      - premium-redesign-20261031
      - full-premium-experience-20261031
      - storefront-complete-rebuild
      - mockup-design-stage-1-20261031
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m py_compile backend/main.py
      - name: Run backend smoke tests
        working-directory: backend
        run: python test_backend.py
      - name: Check storefront JavaScript syntax and assets
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const file of ['index.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g)];
            if (!scripts.length) throw new Error(`No script in ${file}`);
            scripts.forEach((match) => {
              if (!/\bsrc\s*=/.test(match[1])) new Function(match[2]);
            });
            console.log(`OK: ${file} (${scripts.length} script tag(s))`);
          }

          const front = fs.readFileSync('index.html', 'utf8');
          const admin = fs.readFileSync('admin.html', 'utf8');
          const isMockupStorefront = front.includes('assets/mockup-storefront.css') && front.includes('assets/mockup-storefront.js');
          const isNewStorefront = front.includes('assets/new-storefront.css') && front.includes('assets/new-storefront.js');

          if (isMockupStorefront) {
            new Function(fs.readFileSync('assets/mockup-storefront.js', 'utf8'));
            for (const asset of ['assets/mockup-storefront.css', 'assets/mockup-storefront.js', 'assets/local-catalog-fallback.json', 'assets/set-party.webp']) {
              if (!fs.existsSync(asset)) throw new Error('Missing mockup storefront asset: ' + asset);
            }
            console.log('OK: two-screen mockup storefront assets');
          } else if (isNewStorefront) {
            new Function(fs.readFileSync('assets/new-storefront.js', 'utf8'));
            JSON.parse(fs.readFileSync('assets/local-catalog-fallback.json', 'utf8'));
            for (const asset of ['assets/new-storefront.css', 'assets/new-storefront.js', 'assets/local-catalog-fallback.json']) {
              if (!fs.existsSync(asset)) throw new Error('Missing new storefront asset: ' + asset);
            }
            console.log('OK: standalone storefront assets and product photo fallback');
          } else {
            new Function(fs.readFileSync('assets/storefront-experience.js', 'utf8'));
            for (const asset of ['assets/premium-storefront.css', 'assets/full-storefront.css', 'assets/storefront-experience.js']) {
              if (!fs.existsSync(asset)) throw new Error('Missing legacy storefront asset: ' + asset);
            }
            if (!front.includes('premium-storefront.css') || !front.includes('full-storefront.css') || !front.includes('storefront-experience.js')) {
              throw new Error('Legacy storefront theme is not linked');
            }
            console.log('OK: legacy storefront assets');
          }

          for (const asset of ['assets/premium-admin.css', 'assets/full-admin.css', 'assets/admin-workspace.js']) {
            if (!fs.existsSync(asset)) throw new Error('Missing admin redesign asset: ' + asset);
          }
          new Function(fs.readFileSync('assets/admin-workspace.js', 'utf8'));
          if (!admin.includes('premium-admin.css') || !admin.includes('full-admin.css') || !admin.includes('admin-workspace.js')) {
            throw new Error('Admin redesign assets are not linked');
          }
          console.log('OK: admin workspace assets');
          NODE
