services:
  - type: web
    name: tihiy-roll-order-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://alexeykartsev1-svg.github.io
      - key: MAX_INIT_DATA_AGE_SECONDS
        value: "86400"
